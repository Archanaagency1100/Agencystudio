<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Articles | Agency Eleven100</title>
 <link rel="icon" type="image/png" href="/assets/img/favicon.png">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
<link rel="stylesheet" href="/assets/css/studio.css">
<link rel="stylesheet" href="/assets/css/global.css">
     <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K5EB5EZBQ5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    
      gtag('config', 'G-K5EB5EZBQ5');
    </script>
</head>

<body>
     <div id="nav-placeholder"></div>

<section class="article-list-hero">
    <div class="container position-relative z-2">
        <span class="kicker" data-aos="fade-up">Studio Journal //</span>
        <h1 data-aos="fade-up" data-aos-delay="120">Articles From The Studio Floor</h1>
        <p data-aos="fade-up" data-aos-delay="220">
            Read production insights, creative notes, studio ideas and brand storytelling articles by Agency Eleven100.
        </p>
    </div>
</section>

<section class="articles-section">
    <div class="container">

        <div class="filter-bar" data-aos="fade-up">
            <div class="row g-3">
                <div class="col-lg-5">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search articles...">
                </div>

                <div class="col-lg-3">
                    <select id="sortBy" class="form-select">
                        <option value="created_at">Newest</option>
                        <option value="updated_at">Recently Updated</option>
                        <option value="title">Title</option>
                        <option value="id">ID</option>
                    </select>
                </div>

                <div class="col-lg-2">
                    <select id="sortOrder" class="form-select">
                        <option value="desc">DESC</option>
                        <option value="asc">ASC</option>
                    </select>
                </div>

                <div class="col-lg-2">
                    <button class="filter-btn" onclick="loadArticles(1)">Search</button>
                </div>
            </div>
        </div>

        <div class="row g-5" id="articlesGrid"></div>

        <div class="empty-state d-none" id="emptyState">
            No published articles found.
        </div>

        <div class="pagination-wrap" id="paginationWrap"></div>

    </div>
</section>
<div id="footer-placeholder"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/studio.js"></script>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>
AOS.init({
    duration: 900,
    easing: "ease-out-cubic",
    once: false,
    mirror: true,
    offset: 90
});

const API_URL = "https://1100.in/admin/api/articles.php";
const LIMIT = 9;

let currentPage = 1;

function cleanText(value){
    return value ? String(value) : "";
}

function formatDate(dateString){
    if(!dateString) return "";
    const date = new Date(dateString);
    if(isNaN(date)) return dateString;
    return date.toLocaleDateString("en-IN", {
        day:"2-digit",
        month:"short",
        year:"numeric"
    });
}

function getArticlesArray(response){
    if(Array.isArray(response)) return response;
    if(Array.isArray(response.articles)) return response.articles;
    if(Array.isArray(response.data)) return response.data;
    if(response.data && Array.isArray(response.data.articles)) return response.data.articles;
    return [];
}

function getTotalPages(response){
    if(response.total_pages) return Number(response.total_pages);
    if(response.pagination && response.pagination.total_pages) return Number(response.pagination.total_pages);
    if(response.data && response.data.total_pages) return Number(response.data.total_pages);
    return 1;
}

async function loadArticles(page = 1){
    currentPage = page;

    const q = document.getElementById("searchInput").value.trim();
    const sortBy = document.getElementById("sortBy").value;
    const sortOrder = document.getElementById("sortOrder").value;

    const params = new URLSearchParams({
        status: "Published",
        sort_by: sortBy,
        sort_order: sortOrder,
        page: page,
        limit: LIMIT
    });

    if(q){
        params.append("q", q);
    }

    const grid = document.getElementById("articlesGrid");
    const emptyState = document.getElementById("emptyState");
    const paginationWrap = document.getElementById("paginationWrap");

    grid.innerHTML = "";
    paginationWrap.innerHTML = "";
    emptyState.classList.add("d-none");

    try{
        const response = await fetch(`${API_URL}?${params.toString()}`);
        const data = await response.json();

        const articles = getArticlesArray(data);
        const totalPages = getTotalPages(data);

        if(!articles.length){
            emptyState.classList.remove("d-none");
            return;
        }

        articles.forEach((article, index) => {
            const title = cleanText(article.title);
            const slug = cleanText(article.slug);
            const excerpt = cleanText(article.excerpt || article.plain_text).substring(0, 150);
            const image = cleanText(article.cover_image) || "https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=1200";
            const date = formatDate(article.created_at);
const link = `/studio/articles/${slug}`;
            const col = document.createElement("div");
            col.className = "col-lg-4 col-md-6";
            col.setAttribute("data-aos", "fade-up");
            col.setAttribute("data-aos-delay", String((index % 3) * 120));

            col.innerHTML = `
                <article class="article-card">
                    <a href="${link}" class="article-img d-block">
                        <img src="${image}" alt="">
                    </a>

                    <div class="article-meta">
                        <span>${date}</span>
                        <span>Studio Journal</span>
                    </div>

                    <h2>${title}</h2>
                    <p>${excerpt}...</p>

                    <a href="${link}" class="read-link">Read Article →</a>
                </article>
            `;

            grid.appendChild(col);
        });

        renderPagination(totalPages);
        setTimeout(() => AOS.refresh(), 100);

    }catch(error){
        emptyState.textContent = "Unable to load articles.";
        emptyState.classList.remove("d-none");
        console.error(error);
    }
}

function renderPagination(totalPages){
    const paginationWrap = document.getElementById("paginationWrap");

    if(totalPages <= 1) return;

    for(let i = 1; i <= totalPages; i++){
        const btn = document.createElement("button");
        btn.className = `page-btn ${i === currentPage ? "active" : ""}`;
        btn.textContent = i;
        btn.onclick = () => loadArticles(i);
        paginationWrap.appendChild(btn);
    }
}

document.getElementById("searchInput").addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        loadArticles(1);
    }
});

loadArticles(1);
</script>

</body>
</html>
