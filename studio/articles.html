                        </div> -->

                        <img

                            alt="Agency Eleven100 studio advertisement"

                        >

                        <a

                            class="artical-detail-btn"

                            Book Studio →

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="/assets/js/studio.js"></script>

<script>
AOS.init({
    duration: 900,
    easing: "ease-out-cubic",
    once: false,
    mirror: true,
    offset: 90
});

const API_URL = "https://1100.in/admin/api/article.php";
const ARTICLE_BASE_PATH = "/studio/articles/";

/**
 * Get a query-string parameter.
 * This remains available for old URLs such as:
 * articles.html?slug=example
 */
function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
}

/**
 * Get the article slug from a clean URL:
 * /studio/articles/professional-production-studio-guide
 */
function getSlugFromPath() {
    const pathname = window.location.pathname;

    const cleanPath = pathname
        .replace(/^\/+|\/+$/g, "");

    const parts = cleanPath.split("/");

    const articlesIndex = parts.indexOf("articles");

    if (
        articlesIndex !== -1 &&
        parts.length > articlesIndex + 1
    ) {
        return decodeURIComponent(
            parts[articlesIndex + 1]
        );
    }

    return "";
}

function cleanText(value) {
    return value ? String(value) : "";
}

function formatDate(dateString) {
    if (!dateString) {
        return "";
    }

    const date = new Date(dateString);

    if (Number.isNaN(date.getTime())) {
        return dateString;
    }

    return date.toLocaleDateString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric"
    });
}

function getArticleObject(response) {
    if (response?.article) {
        return response.article;
    }

    if (response?.data?.article) {
        return response.data.article;
    }

    if (response?.data) {
        return response.data;
    }

    return response;
}

function updateMetaTag(name, content) {
    if (!content) {
        return;
    }

    let meta = document.querySelector(
        `meta[name="${name}"]`
    );

    if (!meta) {
        meta = document.createElement("meta");
        meta.setAttribute("name", name);
        document.head.appendChild(meta);
    }

    meta.setAttribute("content", content);
}

function updateOpenGraphMeta(property, content) {
    if (!content) {
        return;
    }

    let meta = document.querySelector(
        `meta[property="${property}"]`
    );

    if (!meta) {
        meta = document.createElement("meta");
        meta.setAttribute("property", property);
        document.head.appendChild(meta);
    }

    meta.setAttribute("content", content);
}

function updateCanonicalUrl(slug) {
    const canonicalUrl =
        `https://1100.in${ARTICLE_BASE_PATH}${encodeURIComponent(slug)}`;

    let canonical = document.querySelector(
        'link[rel="canonical"]'
    );

    if (!canonical) {
        canonical = document.createElement("link");
        canonical.setAttribute("rel", "canonical");
        document.head.appendChild(canonical);
    }

    canonical.setAttribute("href", canonicalUrl);

    return canonicalUrl;
}

function showError(message) {
    const loadingState = document.getElementById(
        "loadingState"
    );

    loadingState.textContent = message;
    loadingState.classList.remove("d-none");
}

async function loadArticle() {
    /*
     * First try the clean URL:
     * /studio/articles/article-slug
     */
    let slug = getSlugFromPath();

    /*
     * Fallback support for old URLs:
     * articles.html?slug=article-slug
     */
    if (!slug) {
        slug = getParam("slug");
    }

    const id = getParam("id");

    const loadingState = document.getElementById(
        "loadingState"
    );

    const articleHero = document.getElementById(
        "articleHero"
    );

    const articleWrapper = document.getElementById(
        "articleWrapper"
    );

    if (!slug && !id) {
        showError("Article slug or ID missing.");
        return;
    }

    const params = new URLSearchParams();

    if (slug) {
        params.set("slug", slug);
    } else {
        params.set("id", id);
    }

    try {
        const response = await fetch(
            `${API_URL}?${params.toString()}`,
            {
                headers: {
                    Accept: "application/json"
                }
            }
        );

        if (!response.ok) {
            throw new Error(
                `Article API returned ${response.status}`
            );
        }

        const data = await response.json();
        const article = getArticleObject(data);

        if (!article || !article.id) {
            showError("Article not found.");
            return;
        }

        const articleSlug = cleanText(
            article.slug || slug
        );

        const title = cleanText(article.title);

        const plainText = cleanText(
            article.plain_text
        );

        const excerpt = cleanText(
            article.excerpt || plainText
        ).substring(0, 180);

        const coverImage =
            cleanText(article.cover_image) ||
            "https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=1800";

        const metaTitle =
            cleanText(article.seo?.meta_title) ||
            `${title} | Agency Eleven100`;

        const metaDescription =
            cleanText(article.seo?.meta_description) ||
            excerpt;

        const canonicalUrl = updateCanonicalUrl(
            articleSlug
        );

        document.title = metaTitle;

        updateMetaTag(
            "description",
            metaDescription
        );

        if (article.seo?.meta_keywords) {
            updateMetaTag(
                "keywords",
                cleanText(article.seo.meta_keywords)
            );
        }

        updateOpenGraphMeta(
            "og:type",
            "article"
        );

        updateOpenGraphMeta(
            "og:title",
            metaTitle
        );

        updateOpenGraphMeta(
            "og:description",
            metaDescription
        );

        updateOpenGraphMeta(
            "og:image",
            coverImage
        );

        updateOpenGraphMeta(
            "og:url",
            canonicalUrl
        );

        document.getElementById(
            "heroBg"
        ).style.backgroundImage = `url("${coverImage}")`;

        document.getElementById(
            "articleTitle"
        ).textContent = title;

        document.getElementById(
            "articleExcerpt"
        ).textContent = excerpt;

        document.getElementById(
            "articleDate"
        ).textContent = formatDate(
            article.created_at
        );

        document.getElementById(
            "articleStatus"
        ).textContent = cleanText(
            article.status
        );

        /*
         * Article content comes from the Quill editor
         * and contains HTML.
         */
        document.getElementById(
            "articleContent"
        ).innerHTML = article.content || "";

        loadingState.classList.add("d-none");
        articleHero.classList.remove("d-none");
        articleWrapper.classList.remove("d-none");

        /*
         * Redirect old query-string URLs to the clean URL.
         *
         * Example:
         * /studio/articles.html?slug=example
         *
         * becomes:
         * /studio/articles/example
         */
        const isOldQueryUrl =
            getParam("slug") &&
            !getSlugFromPath();

        if (isOldQueryUrl && articleSlug) {
            window.history.replaceState(
                {},
                "",
                `${ARTICLE_BASE_PATH}${encodeURIComponent(articleSlug)}`
            );
        }

        setTimeout(() => {
            AOS.refresh();
        }, 150);

    } catch (error) {
        console.error("Article loading error:", error);

        showError(
            "Unable to load this article. Please try again later."
        );
    }
}

loadArticle();
</script>

</body>
</html>
