<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Elite Clients & Artists | AgencyEleven100</title>
     <link rel="icon" type="image/png" href="/assets/img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     <link rel="canonical" href="https://1100.in/studio/">

    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: clip;
        }
        .client-header {
            padding: 100px 0 60px;
        }
        .client-header h1 {
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 30%, #a1a1a1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        .client-header p {
            font-size: 15px;
            color: #888888;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }
        .gallery-container {
            margin: 0 auto;
            padding: 0 40px 100px;
        }
        .clients-section-title {
            display: flex;
            align-items: center;
            gap: 18px;
            margin: 0 0 28px;
            color: #ffffff;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: clamp(1.35rem, 2.4vw, 2rem);
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .clients-section-title::after {
            height: 1px;
            flex: 1;
            content: "";
            background: linear-gradient(90deg, #e5b400, rgba(229, 180, 0, 0));
        }
        .client-toggle {
            display: inline-flex;
            gap: 6px;
            margin-bottom: 32px;
            padding: 6px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            background: #111111;
        }
        .client-toggle__button {
            min-height: 44px;
            padding: 10px 22px;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: #888888;
            font: inherit;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.3s ease, background-color 0.3s ease, transform 0.3s ease;
        }
        .client-toggle__button:hover { color: #ffffff; }
        .client-toggle__button.active {
            background: #ffffff;
            color: #050505;
        }
        .client-toggle__button:active { transform: scale(0.97); }
        .client-panel[hidden] { display: none !important; }
        .artist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            width: 100%;
        }
        .artist-box {
            position: relative;
            background-color: #111111;
            border-radius: 12px;
            overflow: hidden;
            height: 320px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), border-color 0.4s ease;
        }
        .artist-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            filter: grayscale(100%) contrast(1.1);
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.4s ease;
            opacity: 0.85;
        }
        .artist-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.4) 50%, transparent 100%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 24px;
            z-index: 2;
        }
        .artist-name {
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            text-align: center;
            margin: 0;
        }
        .artist-box:hover {
            transform: translateY(-6px);
            border-color: rgba(229, 180, 0, 0.3);
        }
        .artist-box:hover img {
            transform: scale(1.04);
            filter: grayscale(0%) contrast(1);
            opacity: 1;
        }
        .artist-box:hover .artist-name {
            color: #e5b400;
        }
        #brand_logo {
            display: grid !important;
            width: 100% !important;
            height: auto !important;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            overflow: visible !important;
            animation: none !important;
            transform: none !important;
        }
        #brand_logo .artist-box img {
            padding: 22px 24px 58px;
            object-fit: contain;
            object-position: center;
            background: radial-gradient(circle at 50% 38%, #292929, #111111 70%);
        }
        @media (max-width: 991px) {
            .gallery-container { padding: 0 24px 80px; }
            .artist-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
            #brand_logo { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
            .client-header h1 { font-size: 2.8rem; }
        }
        @media (max-width: 575px) {
            .gallery-container { padding: 0 16px 60px; }
            .artist-grid { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 12px; }
            .client-header { padding: 60px 0 40px; }
            .client-header h1 { font-size: 2rem; }
            .artist-box { height: 220px; border-radius: 8px; }
            .artist-overlay { padding: 12px; }
            .artist-name { font-size: 10px; letter-spacing: 1.5px; }
            .clients-section-title { gap: 12px; font-size: 1.2rem; }
            .client-toggle { display: flex; width: 100%; }
            .client-toggle__button { flex: 1; padding-right: 12px; padding-left: 12px; font-size: 9px; }
            #brand_logo { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 12px; }
            #brand_logo .artist-box img { padding: 16px 14px 48px; }
        }
    </style>

</head>
<body>
   <div id="nav-placeholder"></div>
    <header class="client-header text-center mt-5">
        <div class="container">
            <h1>OUR CLIENTS</h1>
            <p>Collaborating with India's finest artists, public figures, and creators to shape the future of visual storytelling.</p>
        </div>
    </header>

    <main class="gallery-container">
        <h2 class="clients-section-title" id="clientSectionTitle">Celebrities &amp; Artists</h2>
        <div class="client-toggle" role="tablist" aria-label="Choose client type">
            <button class="client-toggle__button active" id="artistsTab" type="button" role="tab" aria-selected="true" aria-controls="artistsPanel" data-client-view="artists">Celebrities &amp; Artists</button>
            <button class="client-toggle__button" id="brandsTab" type="button" role="tab" aria-selected="false" aria-controls="brandsPanel" data-client-view="brands">Brands</button>
        </div>
        <div class="artist-grid client-panel" id="artistsPanel" role="tabpanel" aria-labelledby="artistsTab"></div>
        <div class="client-panel" id="brandsPanel" role="tabpanel" aria-labelledby="brandsTab" hidden>
            <div class="artist-grid" id="brand_logo"></div>
        </div>
    </main>
<div id="footer-placeholder"></div>
    <script src="/assets/js/artist.js?v=20260819-3"></script>
    <script src="/assets/js/brand.js?v=20260819-3"></script>
 <script src="/assets/js/studio.js?v=20260819-3"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const galleryElement = document.getElementById("artistsPanel");
            
            if (typeof works !== 'undefined' && galleryElement) {
                galleryElement.innerHTML = works.map(work => `
                    <article class="artist-box">
                        <img src="${work.img}" alt="${work.name}" loading="lazy" decoding="async">
                        <div class="artist-overlay">
                            <h3 class="artist-name">${work.name.toUpperCase()}</h3>
                        </div>
                    </article>
                `).join('');
            } else {
                console.error("The 'works' array from artist.js could not be loaded.");
            }
        });

        const brandGrid = document.getElementById('brand_logo');
        if (brandGrid && brandGrid.children.length > 1) {
            const uniqueCount = brandGrid.children.length / 2;
            while (brandGrid.children.length > uniqueCount) brandGrid.lastElementChild.remove();

            [...brandGrid.children].forEach((card) => {
                const label = card.querySelector('div');
                card.className = 'artist-box';
                if (label) {
                    label.className = 'artist-overlay';
                    label.removeAttribute('style');
                    label.innerHTML = `<h3 class="artist-name">${label.textContent.trim()}</h3>`;
                }
            });
        }

        const clientTitle = document.getElementById('clientSectionTitle');
        const clientTabs = document.querySelectorAll('[data-client-view]');
        const clientPanels = {
            artists: document.getElementById('artistsPanel'),
            brands: document.getElementById('brandsPanel')
        };

        function showClientView(view) {
            Object.entries(clientPanels).forEach(([name, panel]) => {
                panel.hidden = name !== view;
            });
            clientTabs.forEach((tab) => {
                const isActive = tab.dataset.clientView === view;
                tab.classList.toggle('active', isActive);
                tab.setAttribute('aria-selected', String(isActive));
            });
            clientTitle.textContent = view === 'brands' ? 'Brands' : 'Celebrities & Artists';
        }

        clientTabs.forEach((tab) => {
            tab.addEventListener('click', () => showClientView(tab.dataset.clientView));
        });
    </script>
</body>
</html>
